
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Rejilla técnica -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.55">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200"/>
    <path d="M100 0 V300 M250 0 V300 M400 0 V300 M550 0 V300 M700 0 V300 M850 0 V300 M1000 0 V300 M1150 0 V300"/>
  </g>

  <!-- Terminal -->
  <rect x="70" y="65" width="620" height="170" rx="14" fill="#0B1120" stroke="#1E293B"/>
  <rect x="70" y="65" width="620" height="34" rx="14" fill="#111827"/>
  <circle cx="94" cy="82" r="6" fill="#EF4444"/>
  <circle cx="114" cy="82" r="6" fill="#F59E0B"/>
  <circle cx="134" cy="82" r="6" fill="#22C55E"/>

  <text x="100" y="135" font-family="Consolas, monospace" font-size="20" fill="#22D3EE">jam@asir:~$</text>
  <text x="240" y="135" font-family="Consolas, monospace" font-size="20" fill="#E2E8F0">systemctl status network</text>
  <text x="100" y="170" font-family="Consolas, monospace" font-size="18" fill="#34D399">[ OK ] VLANs · Routing · Firewall · Hardening</text>
  <text x="100" y="205" font-family="Consolas, monospace" font-size="18" fill="#94A3B8">&gt; securing systems, one packet at a time_</text>

  <!-- PC / servidor -->
  <rect x="770" y="90" width="230" height="120" rx="10" fill="#0B1120" stroke="#22D3EE" stroke-width="2"/>
  <rect x="786" y="106" width="198" height="72" rx="6" fill="#020617"/>
  <text x="806" y="140" font-family="Consolas, monospace" font-size="15" fill="#34D399">root@server:~#</text>
  <text x="806" y="163" font-family="Consolas, monospace" font-size="14" fill="#22D3EE">ssh --secure</text>
  <rect x="850" y="220" width="70" height="10" rx="4" fill="#334155"/>

  <!-- Candado de ciberseguridad -->
  <g transform="translate(1045 95)">
    <rect x="0" y="38" width="80" height="62" rx="12" fill="#0B1120" stroke="url(#accent)" stroke-width="3"/>
    <path d="M18 38 V26 a22 22 0 0 1 44 0 V38" fill="none" stroke="url(#accent)" stroke-width="6"/>
    <circle cx="40" cy="66" r="8" fill="#22D3EE"/>
    <rect x="36" y="70" width="8" height="18" rx="4" fill="#22D3EE"/>
  </g>

  <!-- Nodos de red -->
  <g stroke="#22D3EE" stroke-width="2" fill="none" opacity="0.85">
    <path d="M760 235 L830 205 L900 235 L970 205"/>
  </g>
  <g fill="#34D399">
    <circle cx="760" cy="235" r="6"/>
    <circle cx="830" cy="205" r="6"/>
    <circle cx="900" cy="235" r="6"/>
    <circle cx="970" cy="205" r="6"/>
  </g>
</svg>
